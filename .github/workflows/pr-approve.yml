name: PR Approve (synx-merge-bot)

# Mints a synx-merge-bot App installation token and submits a GitHub PR
# review with event=APPROVE, as that bot identity — an identity distinct
# from whichever account authored the PR, so it counts toward GitHub's
# required-approving-review-count gate (a PR author's own approval never
# counts, and this repo's automation authors most PRs).
#
# ┌─ DESIGN ───────────────────────────────────────────────────────────────────┐
# │ * This workflow is deliberately mechanical: it ALWAYS approves on          │
# │   dispatch. It does NOT decide whether the PR deserves approval — same     │
# │   philosophy as release-dispatch.yml ("the dispatcher fires, it doesn't    │
# │   decide"). That judgment (has the independent Claude Code review come     │
# │   back clean, per T20260922-603756's design) lives entirely in the         │
# │   caller — /address-pr's step d (ccxp-skills/address-pr/SKILL.md). Do not  │
# │   add review-content logic here; keeping the approval decision out of      │
# │   this file is what makes the approval mean something rather than a bare   │
# │   rubber stamp satisfying GitHub's API alone.                              │
# │ * Token is minted fresh per run via actions/create-github-app-token@v3,    │
# │   scoped to ONLY this repo. Same pattern as synxdb-build-pipeline's        │
# │   release-dispatch.yml.                                                    │
# │ * commit_sha is REQUIRED and passed as the review's commit_id — pins the   │
# │   approval to the exact commit the caller's independent review actually   │
# │   covered. Without this, GitHub defaults a review to the PR's HEAD at      │
# │   call time, so a commit landing between "review came back clean" and     │
# │   "this workflow runs" would get silently swept into the approval too.    │
# │   (Caller-side backstop, not built here: enable "dismiss stale reviews    │
# │   on push" in branch protection when that gets configured — T20260922-    │
# │   603756 tracks bundling it with the required-approving-review-count      │
# │   change.)                                                                 │
# │ * FAIL-LOUD: missing secrets / token-mint failure / a review submission    │
# │   the API did not accept all hard-fail with ::error:: and a non-zero       │
# │   exit. A failed approval never looks successful.                          │
# └─────────────────────────────────────────────────────────────────────────────┘

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to approve.'
        required: true
        type: string
      commit_sha:
        description: 'Exact commit SHA the independent review covered — the approval is pinned to this commit, not the PR''s current HEAD.'
        required: true
        type: string

# This workflow only mints an external App token and calls the PR reviews
# API; it needs no permissions on this repo's own GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  approve:
    name: Approve PR as synx-merge-bot
    runs-on: ubuntu-latest
    steps:
      # Fail-loud secret presence check BEFORE minting. The mint action's own
      # error on a missing key is opaque; this names the missing secret.
      - name: Verify required App secrets are present
        env:
          SYNX_MERGE_BOT_APP_ID: ${{ secrets.SYNX_MERGE_BOT_APP_ID }}
          SYNX_MERGE_BOT_APP_PRIVATE_KEY: ${{ secrets.SYNX_MERGE_BOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SYNX_MERGE_BOT_APP_ID:-}" ]; then
            echo "::error::Secret SYNX_MERGE_BOT_APP_ID is not set — cannot mint the synx-merge-bot App token."
            missing=1
          fi
          if [ -z "${SYNX_MERGE_BOT_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret SYNX_MERGE_BOT_APP_PRIVATE_KEY is not set — cannot mint the synx-merge-bot App token."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required App secrets present."

      # Mint a fresh installation token for the synx-merge-bot App, scoped to
      # ONLY this repo. No continue-on-error: a mint failure must hard-fail
      # the job.
      - name: Mint synx-merge-bot App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SYNX_MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.SYNX_MERGE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Submit APPROVE review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::pr_number is required — refusing to approve without a target."
            exit 1
          fi
          if [ -z "${COMMIT_SHA:-}" ]; then
            echo "::error::commit_sha is required — refusing to approve without pinning to the reviewed commit."
            exit 1
          fi

          echo "Approving PR #${PR_NUMBER} in ${GITHUB_REPOSITORY} at commit ${COMMIT_SHA} as synx-merge-bot..."

          # A successful POST /reviews returns HTTP 200. Capture the full
          # response before parsing the status so status parsing cannot close
          # a live pipe early and make a successful `gh api` report SIGPIPE
          # under pipefail. Fail-loud if gh itself fails or if GitHub returns
          # anything other than the accepted status. stderr is left to flow
          # to the job log (not silenced) so a real API failure's actual
          # error body is visible for debugging, not just the generic
          # ::error:: line below.
          resp="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f commit_id="${COMMIT_SHA}" \
            -f body="Approved by synx-merge-bot — dispatched after /address-pr's independent Claude Code review came back clean at commit ${COMMIT_SHA}. See the \"Claude Code review:\" PR comment for the underlying review." \
            -i)" || {
              echo "::error::gh api call failed — review was NOT submitted for PR #${PR_NUMBER}."
              exit 1
            }
          status_line="${resp%%$'\n'*}"
          status_line="${status_line%$'\r'}"
          http_status="$(awk '{print $2}' <<< "$status_line")"

          if [ "${http_status:-}" != "200" ]; then
            echo "::error::PR review submission was not accepted (HTTP ${http_status:-<none>}; expected 200)."
            exit 1
          fi

          echo "Approved PR #${PR_NUMBER} at ${COMMIT_SHA} (HTTP 200)."
          {
            echo "### PR approved"
            echo ""
            echo "- repo: \`${GITHUB_REPOSITORY}\`"
            echo "- pr_number: \`${PR_NUMBER}\`"
            echo "- commit_sha: \`${COMMIT_SHA}\`"
            echo "- reviewer: \`synx-merge-bot\`"
          } >> "$GITHUB_STEP_SUMMARY"
