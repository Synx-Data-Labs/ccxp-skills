name: Markdown Lint
on:
  push:
    branches: [main]
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/markdown-lint.yml']
  pull_request:
    branches: [main]
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/markdown-lint.yml']
  workflow_dispatch:
jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.22.1
